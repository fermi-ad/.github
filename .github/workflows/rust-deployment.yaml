name: Continuous Deployment of Rust Applications

on:
  workflow_call:
    inputs:
      docs:
        required: false
        type: boolean 
        default: false 
        description: "Indicates whether documentation should be generated and deployed to GitHub Pages. Set 'pages' and 'id-token' permissions to be writable."
      image:
        required: false
        type: boolean 
        default: true 
        description: 'Indicates whether an image should be built and deployed to Harbor.'
      pull-git-submodules:
        required: false
        type: boolean
        default: false
        description: 'Indicates whether this repository has Git submodules to pull.'
      references-internal-git-repo:
        required: false
        type: boolean
        default: false
        description: 'Indicates whether this repository has a dependency in its Cargo.toml that comes from an internal GitHub repo.'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # --------------- Initial Setup ------------
      # ------------------------------------------

      - if: ${{ inputs.references-internal-git-repo }}
        name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ACTION_SETTINGS_APP_ID }}
          private-key: ${{ secrets.ACTION_SETTINGS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.pull-git-submodules && 'recursive' || 'false' }}

      # ----------------------------------------------------------------
      # ------------------------ Build ---------------------------------
      # ----------------------------------------------------------------

      - name: Build Artifacts
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: |
            BUILD_DOCS=${{ inputs.docs }}
            BUILD_IMAGE=${{ inputs.image }}
            CARGO_NET_GIT_FETCH_WITH_CLI=${{ inputs.references-internal-git-repo }}
            GIT_TOKEN=${{ steps.app-token.outputs.token }}
          runCmd: |
            set -e
            
            # Configure access to internal Git repositories
            if [ -n "$GIT_TOKEN" ]; then 
              echo "Configuring git API token"
              git config --file /tmp/git-credentials \
                url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf \
                "https://github.com/"
              export GIT_CONFIG_GLOBAL=/tmp/git-credentials
            fi
            
            if [ "$BUILD_IMAGE" = "true" ]; then
              echo "=== BUILD FOR RELEASE ==="
              cargo build --release
            fi
            
            if [ "$BUILD_DOCS" = "true" ]; then 
              echo "=== GENERATING DOCS ==="
              cargo doc --no-deps --all-features
            fi

      # ----------------------------------------------------------------------
      # ------------------------ Image Publishing ----------------------------
      # ----------------------------------------------------------------------

      - name: Docker meta
        id: meta
        if: ${{ inputs.image }}
        uses: docker/metadata-action@v6
        with:
          images: adregistry.fnal.gov/applications/${{ github.event.repository.name }}
          tags: |
            # This is the default tag for the last commit of the default branch
            type=edge
            # This sets the latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.run_number }},enable={{is_default_branch}}

      - name: Set up Docker Buildx
        if: ${{ inputs.image }}
        uses: docker/setup-buildx-action@v4

      - name: Login to AD Registry, Harbor
        if: ${{ inputs.image }}
        uses: docker/login-action@v4
        with:
          registry: adregistry.fnal.gov
          username: ${{ secrets.ADREGISTRY_USERNAME }}
          password: ${{ secrets.ADREGISTRY_SECRET }}

      - name: Building Docker image and pushing to adregistry
        if: ${{ inputs.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Upload Pages Artifact
        if: ${{ inputs.docs }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'target/doc'

  deploy-docs:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.docs }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
