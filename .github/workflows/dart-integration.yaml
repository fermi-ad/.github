name: Continuous Integration workflow for Dart packages

on:
  workflow_call:
    inputs:
      pull-git-submodules:
        description: 'Whether to check out Git submodules.'
        required: false
        type: boolean
        default: false
      references-internal-git-repo:
        description: 'Whether Dart dependencies require access to private GitHub repositories.'
        required: false
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.pull-git-submodules && 'recursive' || 'false' }}

      - if: ${{ inputs.references-internal-git-repo }}
        name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ACTION_SETTINGS_APP_ID }}
          private-key: ${{ secrets.ACTION_SETTINGS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - if: ${{ inputs.references-internal-git-repo }}
        name: Configure Git for private repo access
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: dart analyze

      - name: Test with coverage
        run: |
          mkdir -p coverage
          dart test --coverage-path=coverage/lcov.info

      - name: Generate coverage report
        uses: fermi-ad/code-coverage-reporter@v3
        with:
          coverage_file: coverage/lcov.info
          include_pattern: ^.*\.dart$
          exclude_pattern: test/|\.dart_tool/
