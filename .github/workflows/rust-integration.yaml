name: Continuous Integration workflow for Rust apps

on:
  workflow_call:
    inputs:
      coverage-exclude:
        required: false
        type: string
        default: ''
        description: 'Patterns to add to the coverage exclude configuration. Must begin with a pipe (|) character!'
      pull-git-submodules:
        required: false
        type: boolean
        default: false
        description: 'Indicates whether this repository has Git submodules to pull.'
      references-internal-git-repo:
        required: false
        type: boolean
        default: false
        description: 'Indicates whether this repository has a dependency in its Cargo.toml that comes from an internal GitHub repo'
      static-dependencies:
        required: false 
        type: string
        default: ''
        description: 'A space-delimited list of packages that must be installed on the machine for the code to compile'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: ${{ inputs.references-internal-git-repo }}

    steps:
      - if: ${{ inputs.static-dependencies }}
        name: Install static packages
        run: sudo apt-get update -y && sudo apt-get install -y ${{ inputs.static-dependencies }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.pull-git-submodules && 'recursive' || 'false' }}

      - if: ${{ inputs.references-internal-git-repo }}
        name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ACTION_SETTINGS_APP_ID }}
          private-key: ${{ secrets.ACTION_SETTINGS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - if: ${{ inputs.references-internal-git-repo }}
        name: Configure Git for private repo access
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
        
      - name: Pull from dependency cache
        uses: actions/cache@v5
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Lint
        id: linting
        run: |
            # Checks code conventions with clippy and format with cargo fmt
            # Both commands use `|| ...` so the build and test phase also runs
            RUSTFLAGS=-Wunused-crate-dependencies cargo clippy --workspace --all-targets --all-features -- -D warnings > lints.txt 2>&1 || LINTING_FAILED=true
            cargo fmt --all -- --check >> lints.txt 2>&1 || LINTING_FAILED=true
            # Deletes the lint output file if no failures were reported
            if [ ! -v LINTING_FAILED ]; then
              rm lints.txt
            fi

      # NOTE: First checks if llvm-cov is already installed (pulled from cache), and only proceeds if not found
      # The `&> /dev/null` portion ensures the output of `command -v llvm-cov` is discarded 
      - name: Install coverage dependencies
        run: command -v cargo-llvm-cov &> /dev/null || { cargo install cargo-llvm-cov && rustup component add llvm-tools-preview; }
      
      - name: Run tests with coverage (includes building the project)
        run: cargo llvm-cov --all-features --workspace --all-targets --lcov --output-path target/lcov.info

      # ---------------------------------------------------------------------------------------      
      # ---------------------- Pipeline Results Reporting -------------------------------------
      # ---------------------------------------------------------------------------------------    

      - name: Archive Lint Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: lints.txt

      - name: Generate coverage report
        uses: fermi-ad/code-coverage-reporter@v3
        with:
          coverage_file: target/lcov.info
          include_pattern: src/.*\.rs$
          exclude_pattern: target/${{ inputs.coverage-exclude }}

      - if: always()
        name: Report linting results
        run: |
          if [ -f lints.txt ]; then
            cat lints.txt
            exit 1
          fi
          echo "Linting and quality verifications passed cleanly!"
